<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ragGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="url(#ragGlow)" stroke-width="6" stroke-opacity="0.35" />

  <!-- Ambient glowing core -->
  <circle cx="256" cy="256" r="140" fill="#3b82f6" fill-opacity="0.12" filter="url(#neonBlur)" />

  <!-- Graph Connection Edges -->
  <g stroke="url(#ragGlow)" stroke-width="4" stroke-opacity="0.75" stroke-dasharray="6 6">
    <line x1="256" y1="120" x2="140" y2="230" />
    <line x1="256" y1="120" x2="372" y2="230" />
    <line x1="140" y1="230" x2="180" y2="380" />
    <line x1="372" y1="230" x2="332" y2="380" />
    <line x1="180" y1="380" x2="332" y2="380" />
    <line x1="256" y1="120" x2="256" y2="256" />
    <line x1="140" y1="230" x2="256" y2="256" />
    <line x1="372" y1="230" x2="256" y2="256" />
    <line x1="180" y1="380" x2="256" y2="256" />
    <line x1="332" y1="380" x2="256" y2="256" />
  </g>

  <!-- Nodes (Data Vectors & LLM) -->
  <!-- Center Core Node (Generator / LLM) -->
  <circle cx="256" cy="256" r="38" fill="#0f172a" stroke="url(#ragGlow)" stroke-width="6" />
  <circle cx="256" cy="256" r="20" fill="url(#ragGlow)" filter="url(#neonBlur)" />

  <!-- Peripheral Knowledge Nodes -->
  <!-- Top Node (Query / Prompt) -->
  <circle cx="256" cy="120" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
  <circle cx="256" cy="120" r="12" fill="#38bdf8" />

  <!-- Left Node (Vector Embeddings) -->
  <circle cx="140" cy="230" r="24" fill="#0f172a" stroke="#60a5fa" stroke-width="5" />
  <circle cx="140" cy="230" r="12" fill="#60a5fa" />

  <!-- Right Node (Knowledge Index / HNSW) -->
  <circle cx="372" cy="230" r="24" fill="#0f172a" stroke="#818cf8" stroke-width="5" />
  <circle cx="372" cy="230" r="12" fill="#818cf8" />

  <!-- Bottom Left Node (Reranker) -->
  <circle cx="180" cy="380" r="24" fill="#0f172a" stroke="#a78bfa" stroke-width="5" />
  <circle cx="180" cy="380" r="12" fill="#a78bfa" />

  <!-- Bottom Right Node (Evaluation / Guardrail) -->
  <circle cx="332" cy="380" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
  <circle cx="332" cy="380" r="12" fill="#38bdf8" />
</svg>
